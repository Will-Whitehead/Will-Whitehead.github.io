<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      body.light {
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: background-color 0.3s, color 0.3s;
        padding: 20px;
      }

      .theme-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--card);
        color: var(--text);
        border: 1px solid var(--muted);
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
      }

      #greeting {
        font-size: 1.5rem;
        color: var(--muted);
        margin-bottom: 5px;
      }

      #clock {
        font-size: 4rem;
        font-weight: 700;
        letter-spacing: -1px;
      }

      #date {
        font-size: 1.1rem;
        color: var(--accent);
        margin-bottom: 30px;
      }

      .search-box {
        width: 100%;
        max-width: 480px;
        margin-bottom: 30px;
      }

      .search-box input {
        width: 100%;
        padding: 14px 20px;
        border-radius: 30px;
        border: 1px solid var(--muted);
        background: var(--card);
        color: var(--text);
        font-size: 1rem;
        box-sizing: border-box;
        outline: none;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 12px;
        width: 100%;
        max-width: 480px;
      }

      .links a {
        background: var(--card);
        color: var(--text);
        text-decoration: none;
        padding: 14px;
        border-radius: 12px;
        text-align: center;
        font-weight: 500;
        transition: transform 0.15s;
      }

      .links a:hover {
        transform: translateY(-2px);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <button class="theme-btn" onclick="toggleTheme()">Toggle Theme</button>

    <div id="greeting">Hello</div>
    <div id="clock">00:00:00</div>
    <div id="date">Loading date...</div>

    <!-- Quick Google Search Bar -->
    <form class="search-box" action="https://google.com" method="get">
      <input type="text" name="q" placeholder="Search Google..." autocomplete="off" />
    </form>

    <!-- Quick Links -->
    <div class="links">
      <a href="https://github.com">GitHub</a>
      <a href="https://youtube.com">YouTube</a>
      <a href="https://google.com">Gmail</a>
      <a href="https://reddit.com">Reddit</a>
    </div>

    <script>
      function updateDashboard() {
        const now = new Date();
        const hour = now.getHours();

        // Update greeting based on time of day
        let greetingText = "Good evening";
        if (hour < 12) greetingText = "Good morning";
        else if (hour < 18) greetingText = "Good afternoon";
        document.getElementById("greeting").textContent = greetingText;

        // Update live time and full date
        document.getElementById("clock").textContent = now.toLocaleTimeString();
        document.getElementById("date").textContent = now.toLocaleDateString(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function toggleTheme() {
        document.body.classList.toggle("light");
      }

      updateDashboard();
      setInterval(updateDashboard, 1000);
    </script>
  </body>
</html>
