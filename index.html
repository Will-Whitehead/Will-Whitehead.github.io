<!DOCTYPE html>
<html>
  <head>
    <title>My Website</title>
    <style>
      body {
        background-color: #1e293b;
        color: #ffffff;
        font-family: sans-serif;
        text-align: center;
        padding-top: 50px;
      }
      #clock {
        font-size: 2rem;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Hello, World!</h1>
    <p>Hosted for free with GitHub Pages.</p>

    <!-- The live time will appear inside this div -->
    <div id="clock"></div>

    <script>
      function updateTime() {
        const now = new Date();
        document.getElementById("clock").textContent = now.toLocaleTimeString();
      }
      updateTime(); // Run immediately so there is no 1-second delay
      setInterval(updateTime, 1000); // Update every 1,000 milliseconds (1 second)
    </script>
  </body>
</html>
